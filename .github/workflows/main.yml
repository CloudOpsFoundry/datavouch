name: Validate
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# No concurrency cancellation: every push event keeps its validation run.
jobs:
  validate:
    name: validate (3.15)
    if: >-
      github.event.repository.private &&
      vars.DATAVOUCH_TRUSTED_RUNNER == 'true' &&
      github.actor == vars.DATAVOUCH_TRUSTED_ACTOR &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, datavouch_local]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/validate
        with:
          python: '3.15.2'
