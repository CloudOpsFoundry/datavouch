name: DataVouch CI
on:
  push:
    branches: ['**']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# One full run per branch push. Checks attach to the commit shown on its PR.
# Preserve every pushed revision; no cancellation by newer commits.
jobs:
  quality:
    name: Code quality and static analysis
    if: >-
      github.event.repository.private &&
      vars.DATAVOUCH_TRUSTED_RUNNER == 'true' &&
      github.actor == vars.DATAVOUCH_TRUSTED_ACTOR
    runs-on: [self-hosted, Linux, datavouch_local]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Formatting
        run: uv run --no-sync python scripts/validate.py --stage format
      - name: Validate commit convention
        run: uv run --no-sync cz check --message "$(git log -1 --format=%B)"
      - name: Lint
        run: uv run --no-sync python scripts/validate.py --stage lint
      - name: Workflow lint
        run: uv run --no-sync python scripts/validate.py --stage workflows
      - name: Helm deployment contracts
        run: uv run --no-sync python scripts/validate.py --stage deployment
      - name: Static type analysis
        run: uv run --no-sync python scripts/validate.py --stage types
      - name: Source security analysis
        run: uv run --no-sync python scripts/validate.py --stage security
  tests:
    name: Tests and coverage
    if: >-
      github.event.repository.private &&
      vars.DATAVOUCH_TRUSTED_RUNNER == 'true' &&
      github.actor == vars.DATAVOUCH_TRUSTED_ACTOR
    runs-on: [self-hosted, Linux, datavouch_local]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: uv run --no-sync python scripts/validate.py --stage unit
      - name: Adapter contract tests
        run: uv run --no-sync python scripts/validate.py --stage contract
      - name: Integration and regression tests
        run: uv run --no-sync python scripts/validate.py --stage integration
      - name: Coverage threshold
        run: uv run --no-sync python scripts/validate.py --stage coverage
      - name: Preserve test diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-test-reports
          path: .ci-artifacts/*.xml
          if-no-files-found: ignore
          retention-days: 3
  audit:
    name: Dependency vulnerability audit
    if: >-
      github.event.repository.private &&
      vars.DATAVOUCH_TRUSTED_RUNNER == 'true' &&
      github.actor == vars.DATAVOUCH_TRUSTED_ACTOR
    runs-on: [self-hosted, Linux, datavouch_local]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check current vulnerability data
        run: uv run --no-sync python scripts/validate.py --stage dependencies
  package:
    name: Build and installed-package regression
    needs: [quality, tests]
    if: >-
      github.event.repository.private &&
      vars.DATAVOUCH_TRUSTED_RUNNER == 'true' &&
      github.actor == vars.DATAVOUCH_TRUSTED_ACTOR
    runs-on: [self-hosted, Linux, datavouch_local]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build wheel and source distribution
        run: uv run --no-sync python scripts/validate.py --stage build
      - name: Check archive boundaries
        run: uv run --no-sync python scripts/validate.py --stage integrity
      - name: Install wheel and verify expected outcomes
        run: uv run --no-sync python scripts/validate.py --stage installation
      - name: Source and wheel parity
        run: uv run --no-sync python scripts/validate.py --stage sdist
      - name: Release metadata validation
        run: uv run --no-sync python scripts/validate.py --stage release
  gate:
    name: CI passed
    needs: [quality, tests, audit, package]
    if: >-
      always() &&
      github.event.repository.private &&
      vars.DATAVOUCH_TRUSTED_RUNNER == 'true' &&
      github.actor == vars.DATAVOUCH_TRUSTED_ACTOR
    runs-on: [self-hosted, Linux, datavouch_local]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all checks and package validation
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: uv run --no-project --python 3.15.2 python scripts/check_ci_results.py
  release:
    name: Version, tag and release notes
    needs: [gate]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.event.repository.private &&
      vars.DATAVOUCH_TRUSTED_RUNNER == 'true' &&
      github.actor == vars.DATAVOUCH_TRUSTED_ACTOR
    runs-on: [self-hosted, Linux, datavouch_local]
    permissions:
      contents: write
    concurrency:
      group: datavouch-release-main
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Release the tested main revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/release.py
