name: Trusted private feature validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: >-
      github.event.repository.private &&
      startsWith(github.ref, 'refs/heads/feature/') &&
      vars.DATAVOUCH_TRUSTED_RUNNER == 'true' &&
      github.actor == vars.DATAVOUCH_TRUSTED_ACTOR
    runs-on: [self-hosted, Linux, datavouch_local]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/validate
        with:
          python: '3.15.2'
