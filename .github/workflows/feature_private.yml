name: Trusted private feature validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-feature-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event.repository.private && startsWith(github.ref, 'refs/heads/feature/') && vars.DATAVOUCH_TRUSTED_RUNNER == 'true'
    runs-on: [self-hosted, datavouch_local]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync python scripts/validate.py
