name: Trusted private feature validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: >-
      github.event.repository.private &&
      startsWith(github.ref, 'refs/heads/feature/') &&
      vars.DATAVOUCH_TRUSTED_RUNNER == 'true' &&
      github.actor == vars.DATAVOUCH_TRUSTED_ACTOR
    uses: ./.github/workflows/main.yml
