name: Public contribution CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Validation
    uses: CloudOpsFoundry/ci-templates/.github/workflows/python-uv.yml@526cc5320fffce2832cc6ade8f3d304809edf001
    with:
      python-version: '3.15.2'
      validation-command: uv run --no-sync python scripts/validate.py
  gate:
    name: Public CI passed
    needs: [validate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful shared validation
        env:
          RESULT: ${{ needs.validate.result }}
        run: test "$RESULT" = success
