name: Workload verification example
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workload-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.event.repository.private &&
      vars.DATAVOUCH_TRUSTED_RUNNER == 'true' &&
      github.actor == vars.DATAVOUCH_TRUSTED_ACTOR &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, datavouch_local]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: uv sync --locked --no-dev --python 3.15.2
      - name: Verify synthetic workload
        run: >-
          uv run --no-sync --python 3.15.2 datavouch gate examples/verification/passing.json
          --policy examples/workflow/policy.json
          --output-dir "$RUNNER_TEMP/datavouch-reports"
      - name: Add pull request run summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/datavouch-reports/summary.md" ]; then
            cat "$RUNNER_TEMP/datavouch-reports/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
