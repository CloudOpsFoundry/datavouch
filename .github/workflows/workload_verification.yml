name: Workload verification example
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: CloudOpsFoundry/ci-templates/.github/workflows/python-uv.yml@526cc5320fffce2832cc6ade8f3d304809edf001
    with:
      python-version: '3.15.2'
      validation-command: >-
        uv run --no-sync datavouch gate examples/verification/passing.json
        --policy examples/workflow/policy.json
        --output-dir "$RUNNER_TEMP/workload-reports"
