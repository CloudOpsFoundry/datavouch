name: Workload verification example
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workload-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
      - run: uv sync --locked --no-dev
      - name: Verify synthetic workload
        run: >-
          uv run --no-sync datavouch gate examples/verification/passing.json
          --policy examples/workflow/policy.json
          --output-dir "$RUNNER_TEMP/datavouch-reports"
      - name: Add pull request run summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/datavouch-reports/summary.md" ]; then
            cat "$RUNNER_TEMP/datavouch-reports/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: datavouch-verification
          path: ${{ runner.temp }}/datavouch-reports/
          if-no-files-found: warn
          retention-days: 7
