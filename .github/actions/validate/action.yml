name: DataVouch validation
description: Locked dependencies and required local validation stages
inputs:
  python:
    description: Installed Python version
    required: true
runs:
  using: composite
  steps:
    - name: Record tested revision and tool versions
      shell: bash
      run: |
        git rev-parse HEAD
        uv --version
        uv python find '${{ inputs.python }}'
    - name: Install locked dependencies
      shell: bash
      run: uv sync --locked --all-extras --python '${{ inputs.python }}'
    - name: Formatting
      shell: bash
      run: uv run --no-sync --python '${{ inputs.python }}' python scripts/validate.py --stage format
    - name: Lint
      shell: bash
      run: uv run --no-sync --python '${{ inputs.python }}' python scripts/validate.py --stage lint
    - name: Workflow lint
      shell: bash
      run: uv run --no-sync --python '${{ inputs.python }}' python scripts/validate.py --stage workflows
    - name: Static type analysis
      shell: bash
      run: uv run --no-sync --python '${{ inputs.python }}' python scripts/validate.py --stage types
    - name: Unit tests
      shell: bash
      run: uv run --no-sync --python '${{ inputs.python }}' python scripts/validate.py --stage unit
    - name: Adapter contract tests
      shell: bash
      run: uv run --no-sync --python '${{ inputs.python }}' python scripts/validate.py --stage contract
    - name: Integration tests
      shell: bash
      run: uv run --no-sync --python '${{ inputs.python }}' python scripts/validate.py --stage integration
    - name: Coverage threshold and report
      shell: bash
      run: uv run --no-sync --python '${{ inputs.python }}' python scripts/validate.py --stage coverage
    - name: Source security analysis
      shell: bash
      run: uv run --no-sync --python '${{ inputs.python }}' python scripts/validate.py --stage security
    - name: Dependency vulnerability audit
      shell: bash
      run: uv run --no-sync --python '${{ inputs.python }}' python scripts/validate.py --stage dependencies
    - name: Build wheel and source distribution
      shell: bash
      run: uv run --no-sync --python '${{ inputs.python }}' python scripts/validate.py --stage build
    - name: Repository and archive boundaries
      shell: bash
      run: uv run --no-sync --python '${{ inputs.python }}' python scripts/validate.py --stage integrity
    - name: Clean installation and CLI replay
      shell: bash
      run: uv run --no-sync --python '${{ inputs.python }}' python scripts/validate.py --stage installation
    - name: Source and wheel parity
      shell: bash
      run: uv run --no-sync --python '${{ inputs.python }}' python scripts/validate.py --stage sdist
    - name: Release metadata and dependency inventory
      shell: bash
      run: uv run --no-sync --python '${{ inputs.python }}' python scripts/validate.py --stage release
    - name: Preserve test and coverage reports
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: validation-${{ inputs.python }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          .ci-artifacts/
          dist/
        if-no-files-found: warn
        retention-days: 7
