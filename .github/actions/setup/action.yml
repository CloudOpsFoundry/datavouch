name: Set up DataVouch
description: Verify the pinned Python runtime and install locked dependencies
runs:
  using: composite
  steps:
    - name: Record tested revision and runtime
      shell: bash
      run: |
        git rev-parse HEAD
        uv --version
        uv run --no-project --python 3.15.2 python -c 'import sys; assert sys.version_info[:3] == (3, 15, 2); print(sys.version)'
    - name: Install locked dependencies from the image cache
      shell: bash
      run: |
        if uv sync --locked --all-extras --no-install-project --python 3.15.2 --offline; then
          echo 'Dependencies restored from the local image cache.'
        else
          echo 'Refreshing dependencies required by this revision.'
          uv sync --locked --all-extras --no-install-project --python 3.15.2
        fi
        uv sync --locked --all-extras --no-build-isolation --python 3.15.2 --offline
