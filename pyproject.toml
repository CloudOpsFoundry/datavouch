[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "datavouch"
version = "0.2.0a0"
description = "Reproducible evidence for data workload changes"
readme = "README.md"
requires-python = ">=3.15,<3.16"
license = "MIT"
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]
dependencies = []

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.47,<4"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1,<4"]

[project.scripts]
datavouch = "datavouch.cli:main"

[dependency-groups]
dev = ["commitizen==4.19.3", "pyyaml>=6,<7", "httpx>=0.28,<1", "pytest>=8", "ruff>=0.12", "mypy>=1.16", "coverage>=7", "build>=1.2", "bandit>=1.8", "pip-audit>=2.9", "hatchling>=1.27,<2", "editables>=0.5,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/datavouch"]

[tool.hatch.build.targets.sdist]
include = ["/.github", "/src", "/tests", "/scripts", "/docs", "/examples", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE", "/SECURITY.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/deployment"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/adapters"]
addopts = "-ra"

[tool.coverage.run]
relative_files = true
source = ["datavouch"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "pep440"
tag_format = "v$version"
version_files = ["src/datavouch/__init__.py:__version__"]
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = true
major_version_zero = false
annotated_tag = true
bump_message = "chore(release): $new_version"
